
name: CI-CD AnalyseProject

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7

      - name: Installation de Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation et tests Maven
        run: mvn -B -ntp clean verify

      - name: Vérification du JAR
        run: |
          ls -lh target/
          test -f target/AnalyseProject-0.0.1-SNAPSHOT.jar

      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: analyseproject-jar
          path: target/AnalyseProject-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Construction de l'image Docker
        run: docker build -t analyse-project:1.0 .
